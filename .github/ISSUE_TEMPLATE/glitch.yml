name: Graphics or sound glitch
description: Something is drawn or sounds wrong (a part not redrawn, wrong colors, a missing animation, a wrong sound).
labels: [ glitch ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Glitches are welcome here: the drawing and the sound are meant to match the DOS game pixel for pixel
        and note for note. A screenshot helps most.
  - type: textarea
    id: what
    attributes:
      label: What looks or sounds wrong
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Level and room
      description: Shift+R (with cheats on) shows the room number.
      placeholder: level 3, room 4
    validations:
      required: true
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or a replay
      description: Paste screenshots here. A replay (`--record NAME`, then attach replays/NAME.p2r zipped) lets us see the same frames.
  - type: input
    id: build
    attributes:
      label: Build
      description: The download's name (it carries the commit) or BUILD-*.txt's commit.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Settings changed from the defaults (SDLPoP2.ini / the menu), window size or scaling, system.
