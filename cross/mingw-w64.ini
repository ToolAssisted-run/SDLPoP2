# Cross file: build the Windows (x86_64) executables from a Linux host with mingw-w64.
#   meson setup build-windows --cross-file cross/mingw-w64.ini
# The GCC runtime is linked statically, so sdlpop2.exe needs only system DLLs (SDL2 is built in from the wrap).
# To run the Windows test programs under Wine, add:  --cross-file cross/wine.ini

[binaries]
c = 'x86_64-w64-mingw32-gcc'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'false'

[built-in options]
c_link_args = ['-static']
default_library = 'static'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
