; ======================
; SDLPoP2 configuration
; ======================

; This is the configuration file of SDLPoP2's SDL frontend (sdl/main.c).
; Lines starting with a semicolon (";") are comments and are ignored.
; "default" is a valid setting for any option.
;
; Every default reproduces the original DOS game exactly. The frontend looks for this file in this order:
;   1. the path given with --ini PATH
;   2. SDLPoP2.ini in the current directory
;   3. SDLPoP2.ini next to the sdlpop2 binary
;   4. the installed copy (share/sdlpop2/SDLPoP2.ini)
; Unknown options are reported on the terminal and ignored.
;
; The in-game menu (Esc, see enable_pause_menu) changes settings too, as SDLPoP's does: it saves them, when the menu
; closes, to SDLPoP2.cfg next to this file (the current directory when this is the installed copy or there is none),
; in this file's syntax, and SDLPoP2.cfg is read after this file - unless this file is newer (edited since): then
; SDLPoP2.cfg is ignored. Delete SDLPoP2.cfg to go back to this file's settings.


[General]
; Start the game in fullscreen mode. (In-game fullscreen toggle: Alt+Enter)
start_fullscreen = false

; Width and height of the game window, in pixels.
; By default (auto) the window is 960 x 720 (960 x 600 without the 4:3 aspect ratio below).
window_width = default
window_height = default

; Show the game in the 4:3 aspect ratio of the VGA mode 13h picture on a monitor of the time (320 x 200 pixels,
; drawn 1.2 times taller than wide). false: square pixels (320 x 200 = 16:10).
use_correct_aspect_ratio = true

; Make all pixels the same size by using integer scale factors only (black borders fill the rest).
use_integer_scaling = false

; Scaling method.
; Possible values:
; * sharp  = Use nearest-neighbour resampling.
; * fuzzy  = First scale to double size with nearest-neighbour scaling, then scale to the window with smooth scaling.
; * blurry = Use smooth scaling.
scaling_type = sharp

; Play the music (the MIDI pieces on the FM chip). (default = true)
; The game's own Alt+M (ambient music on/off) and Alt+S (sound on/off) still work as in DOS.
enable_music = true

; Play the sound effects (the digitized sounds; with the PC speaker, all of its sounds and tunes). (default = true)
enable_sounds = true

; Volume when the sound is on, 0 (silent) to 15 (full). (default = 15)
; The game's Alt+S toggles the sound on and off as in DOS; "on" plays at this volume.
volume = 15

; The sound hardware to play the game's sounds on (the drivers the game ships with).
; Possible values:
; * fm_digital = Sound Blaster Pro: MIDI music on the FM chip and digitized sound effects (what the DOS setup,
;                CONFIG.DAT, configures here). (default)
; * fm         = the FM chip only: music, no digitized sounds.
; * digital    = digitized sounds only, no music.
; * speaker    = the PC speaker (IBMSND.DAT).
; The game itself still behaves as configured by CONFIG.DAT; this only chooses what is heard.
sound_device = fm_digital

; Play the intro (the story scenes 7, 4 and 8 of the title sequence). (default = true)
; Without it the title goes on to the credits and the demos; a key during a demo starts the game.
enable_intro = true

; Play the story scenes between the levels (and the time-out and ending scenes). (default = true)
; A skipped scene counts as played to its end: the game's state after it is the same.
enable_story_scenes = true

; Always skip the title sequence: a new game starts at once (at first_level below). (default = false)
skip_title = false

; Show the in-game menu (SDLPoP's overlay menu: resume, quicksave, quickload, restart level, settings, quit) when you
; pause the game with Esc or the controller's button_menu. (default = true, as in SDLPoP)
; If disabled, Esc pauses the game as in DOS, and you can still bring up the menu with Backspace or a mouse click.
; The settings changed in the menu are saved to SDLPoP2.cfg (see the top of this file).
enable_pause_menu = true

; The keys of the controls, as SDL key (scancode) names, e.g. Left, Right, Up, Down, Home, PageUp, End, PageDown,
; A .. Z, Space, Left Shift, Right Shift, Left Ctrl, Right Ctrl, Keypad 4, ...
; (https://wiki.libsdl.org/SDL2/SDL_Scancode lists them; SDL_GetScancodeName's names.)
; A key given here does what the original key does; the original keys keep working (the arrows, Home / PgUp /
; End / PgDn, the keypad, and the W E R / S D F / X C V and U I O / J K L / M , . grids, both Shifts, both Ctrls).
; Defaults: the original keys.
key_left = Left
key_right = Right
key_up = Up
key_down = Down
key_upleft = Home
key_upright = PageUp
key_downleft = End
key_downright = PageDown
; action / sword (Shift)
key_shift = Left Shift
; draw the sword, the spirit's cast (Ctrl)
key_ctrl = Left Ctrl


[AdditionalFeatures]
; Enable quicksave/load. (In-game: F6 to quicksave, F9 to quickload.)
; The whole game state is kept in memory (one slot, lost when the program ends).
enable_quicksave = true

; A quickload costs one minute of game time (as in SDLPoP: time keeps running out even with quickloads).
; Only applies when quickload is used; not before the clock starts running. (default = true)
enable_quicksave_penalty = true

; Enable recording and replaying (command line: --record NAME / --replay NAME).
; A replay holds the random seed, the command-line words, the settings that change the game, the game's own
; files as they were (PRINCE.OPT, PRINCE.HOF, PRINCE.SAV) and the input of every video frame; playing it back
; reproduces the session exactly, and checks so at its end.
enable_replay = true

; The folder where replays are kept (a NAME without a directory goes there).
replays_folder = replays

; The random seed. The DOS game seeds its random numbers from the clock at start.
; Possible values:
; * clock  = the current time, as in DOS. (default)
; * a number (0 .. 4294967295) = the same seed every time.
random_seed = clock

; F1 shows a summary of the keys (the game waits meanwhile).
enable_info_screen = true


[Controller]
; Play with a game controller (SDL's game controller support: the controllers in SDL's database, e.g. Xbox,
; PlayStation, Switch Pro and most USB and Bluetooth pads; plugged in or unplugged at any time). (default = true)
; Every connected controller drives the game (their buttons and sticks are combined).
; The controller gives the game the keys the keyboard does (the arrows, Shift, Ctrl, Esc, ...), so replays, quicksaves
; and the game itself work as with the keyboard. The DOS game's own joystick mode (Alt+J, the options menu's
; "Joystick Mode") is not used for it: as in DOS without a joystick, it reports "Joystick Not Found".
enable_controller = true

; Rumble when the prince is hurt (loses hit points), at full strength for 100 milliseconds, as in SDLPoP. (default = true)
controller_rumble = true

; The analog 'dead zone' of the stick (and how far a trigger must be pressed). Range: 0 to 32767 (default = 8000)
joystick_threshold = 8000

; Use the left stick for left and right only (up and down come from the D-pad and the up / down buttons below),
; which can make running and jumping easier to control. The D-pad always gives all eight directions; in the menus
; the stick moves up and down anyway. (default = false: the stick gives all eight directions; SDLPoP's default is true)
joystick_only_horizontal = false

; A file with more controller mappings, in SDL's format (e.g. gamecontrollerdb.txt from
; https://github.com/mdqinc/SDL_GameControllerDB), for a controller SDL does not know. (default: none)
; (SDL also reads mappings from the SDL_GAMECONTROLLERCONFIG environment variable.)
gamecontrollerdb_file =

; The buttons, as SDL game controller names (positions on an Xbox-style pad; several names separated by spaces):
; a, b, x, y, back, guide, start, leftstick, rightstick (the sticks pressed in), leftshoulder, rightshoulder,
; lefttrigger, righttrigger, dpup, dpdown, dpleft, dpright, misc1, paddle1 .. paddle4, touchpad; none = no button.
; The D-pad and the left stick always move (the arrows; a diagonal is the two arrows together, like Home / PgUp /
; End / PgDn). While playing (the defaults are SDLPoP's layout, with PoP2's Ctrl on B):
; up (jump, climb; the up arrow)
button_up = y
; down (crouch, go down; the down arrow)
button_down = a
; action / sword (Shift)
button_shift = x lefttrigger righttrigger
; draw the sword, the spirit's cast (Ctrl)
button_ctrl = b
; the in-game menu (with enable_pause_menu; without it: Esc, pause the game; pressed again, the pause ends)
button_menu = start
; Alt+A: restart the level
button_restart = back
; F6 / F9: quicksave and quickload (with enable_quicksave)
button_quicksave = leftshoulder
button_quickload = rightshoulder
; space: show the time left
button_time = rightstick
; F1: the info screen (with enable_info_screen)
button_info = none
; In the menus (options, saving and restoring games, the hall of fame, the copy protection) the buttons are fixed:
; the D-pad and the stick move, A = Enter, B / Back / button_menu = Esc, X = Tab (the next field), Y types the name
; "Prince" (the name fields: a saved game, the hall of fame), the other buttons = space.
; On the title, in the story scenes and the demo, any button is the game's "press a key".
; A button still held when the game goes from one of these to another is ignored until it is released.

[CustomGameplay]
; Starting minutes left. (default = 75)
start_minutes_left = 75

; Game clock ticks per minute. (default = 719; one tick = 1/12 second, so a minute of the clock is 59.92 seconds)
ticks_per_minute = 719

; Starting hit points. (default = 3)
start_hitp = 3

; Maximum number of hit points (the potions of life, and the cheat key T, stop there). (default = 12)
max_hitp_allowed = 12

; Minutes left after skipping a level with Alt+N without the cheat word (allowed up to level 3). (default = 15)
skip_level_reduced_minutes = 15

; The level a new game starts at. (default = 1)
first_level = 1

; Game speed when not fighting (delay between ticks in 1/60 seconds). Smaller is faster. (default = 5)
base_speed = 5

; Game speed when the prince has his sword drawn (delay between ticks in 1/60 seconds). Smaller is faster. (default = 6)
fight_speed = 6


; The following option can be used in all level sections:
; sword_type = the prince's sword on this level: none, 1 or 2 (2: the reach is 5 pixels shorter).
;              A restarted level keeps the one of its checkpoint.
;              Defaults: none on level 6, 2 on levels 7 and 8, 1 elsewhere.
; (The guards' types and hit points are not per-level constants: each guard's record in the level data has them.)
