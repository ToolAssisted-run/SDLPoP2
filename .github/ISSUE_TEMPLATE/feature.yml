name: Feature request
description: An idea for a setting, a cheat, a frontend feature or anything else.
labels: [ enhancement ]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! The game's own behaviour stays as the DOS game has it (changes to it go in as settings,
        off by default, as in SDLPoP), and the copy protection stays.
  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: How SDLPoP or another port does it, mockups, ...
